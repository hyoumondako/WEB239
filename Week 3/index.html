<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Loren Bracciano, 09/13/2026 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff4cf;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #charBox {
            background:#ffd519;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            text-align: center;
        }
        button{
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background: #ffab19;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #da8001;
        }
    </style>
    <title>Assignment 3</title>
</head>
<body>
    <h1>Random Simpsons Character Generator</h1>
    <div id="charBox">Click the button to load a Simpsons character!</div>
        <button id="newChar">Get a New Character</button>

    <script>
        const charBox = document.getElementById('charBox');
        const button = document.getElementById('newChar');

        const maxCharID = 1182; //this API doesn't have a random feature, so I had to make my own random number generator. There are 1182 characters in this API; each character has thier own IDs number from 1 to 1182.

        function getRandomId(max) {
            return Math.floor(Math.random() * max) + 1; //Math.random starts at 0, which wouldn't work with the character ID, so +1 to start it at one.
        }

        async function getCharacter() {
            charBox.textContent = "Loading...";
                try {
                    const randomId = getRandomId(maxCharID);
                    const response = await fetch(`https://thesimpsonsapi.com/api/characters/${randomId}`); //I had to look up how to insert a variable in a URL!
                    const charData = await response.json();
                    charBox.textContent = charData.name;
                } catch (error) {
                    charBox.textContent = "D'oh! Something went wrong.";
                    console.error(error);
                }
            }
        button.addEventListener('click', getCharacter);


    </script>
</body>

</html>
